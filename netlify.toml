# netlify.toml
# Configuration pour déploiement Netlify

[build]
  command = "echo 'PWA ready to deploy'"
  publish = "."

# Headers pour PWA
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(self), microphone=()"

# Headers pour manifest.json (important!)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "max-age=3600"

# Headers pour Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Headers pour HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=3600"

# Redirect pour SPA (si besoin)
[[redirects]]
  from = "/*"
  to = "/lord-system-pwa.html"
  status = 200

# Functions (optionnel - pour future API)
[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Plugins (optionnel)
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    outputPath = "lighthouse"
    audits = "performance,accessibility,best-practices,seo,pwa"
