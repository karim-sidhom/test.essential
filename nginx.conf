# LORD SYSTEM PWA - Nginx Configuration
# Ajoutez ce bloc à votre configuration nginx.conf ou dans un fichier séparé

server {
    # Écoutez sur le port 443 pour HTTPS
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Certificats SSL (remplacer par votre chemin)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # Configuration SSL sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Racine du document (adapter au chemin réel)
    root /var/www/lord-system;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Charset par défaut
    charset utf-8;

    # Logging
    access_log /var/log/nginx/lord-system-access.log;
    error_log /var/log/nginx/lord-system-error.log;

    # ── Headers de Sécurité ──
    
    # Empêche le sniffing de type de contenu
    add_header X-Content-Type-Options "nosniff" always;
    
    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # ── Cache Headers ──

    # Images - cache long
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS, JS, Fonts - cache long
    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML - cache court (peut changer)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Manifest & JSON - cache court
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type "application/json";
    }

    # Service Worker - cache court
    location = /sw.js {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header Content-Type "application/javascript";
    }

    # ── MIME Types ──
    types {
        application/manifest+json webmanifest manifest;
        application/json json;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
    }

    # ── Routing SPA ──
    # Redirige les requêtes vers index.html pour le routing côté client
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Sécurité: Empêcher l'accès aux fichiers sensibles ──
    location ~ /\.{
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Empêcher l'accès à des répertoires spécifiques
    location ~ (^|/)\. {
        deny all;
    }

    location ~ \.env$ {
        deny all;
    }

    # Redirect HTTP vers HTTPS (optionnel)
    # Décommentez si vous avez un bloc server pour HTTP:80
}

# Bloc de redirection HTTP → HTTPS (optionnel)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    
    # Redirection permanente vers HTTPS
    return 301 https://$server_name$request_uri;
}

# Optimisations de performance
fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHE:10m inactive=60m max_size=1g;

# Paramètres de connexion
keepalive_timeout 65;
client_max_body_size 100m;

# Optimisation HTTP/2
http2_max_field_size 16k;
http2_max_header_size 32k;
