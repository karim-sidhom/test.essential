<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LORD SYSTEM - TEST FICHIERS</title>
  <meta name="theme-color" content="#0a0500">
  <link rel="manifest" href="manifest.json">
  
  <style>
    :root {
      --deep: #0a0500;
      --gold-bright: #e87722;
      --gold-shine: #f5a623;
      --text: #fff4e8;
      --text-dim: #c89060;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--deep);
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(20, 8, 0, 0.92);
      border: 1px solid var(--gold-bright);
      border-radius: 12px;
      padding: 20px;
    }
    
    h1 {
      color: var(--gold-shine);
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    
    .status-section {
      background: rgba(232, 119, 34, 0.1);
      border-left: 3px solid var(--gold-bright);
      padding: 15px;
      margin: 15px 0;
      border-radius: 6px;
    }
    
    .status-title {
      color: var(--gold-shine);
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 14px;
    }
    
    .status-ok {
      color: #4caf50;
    }
    
    .status-error {
      color: #ff9800;
    }
    
    .status-pending {
      color: var(--text-dim);
    }
    
    .button {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-shine));
      color: var(--deep);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px;
      font-size: 14px;
    }
    
    .button:hover {
      opacity: 0.9;
    }
    
    .button-container {
      text-align: center;
      margin: 20px 0;
    }
    
    .console-log {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--gold-bright);
      padding: 15px;
      border-radius: 6px;
      margin: 15px 0;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    
    .log-entry {
      margin: 5px 0;
      line-height: 1.4;
    }
    
    .log-success { color: #4caf50; }
    .log-error { color: #ff9800; }
    .log-info { color: var(--gold-shine); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎯 LORD SYSTEM - Vérification des fichiers</h1>
  
  <div class="status-section">
    <div class="status-title">📊 État des chargements</div>
    
    <div class="status-item" id="status-config">
      <span class="status-pending">⏳</span>
      <span>config.js</span>
    </div>
    
    <div class="status-item" id="status-search">
      <span class="status-pending">⏳</span>
      <span>advanced-search.js</span>
    </div>
    
    <div class="status-item" id="status-algorithms">
      <span class="status-pending">⏳</span>
      <span>advanced-algorithms.js</span>
    </div>
    
    <div class="status-item" id="status-itinerary">
      <span class="status-pending">⏳</span>
      <span>smart-itinerary-ai.js</span>
    </div>
    
    <div class="status-item" id="status-sw">
      <span class="status-pending">⏳</span>
      <span>Service Worker</span>
    </div>
  </div>
  
  <div class="status-section">
    <div class="status-title">🔧 Tests de fonctionnalités</div>
    
    <div class="button-container">
      <button class="button" onclick="testSearch()">🔍 Test Recherche</button>
      <button class="button" onclick="testItinerary()">🎤 Test Itinéraire</button>
      <button class="button" onclick="clearLogs()">🗑️ Effacer logs</button>
    </div>
  </div>
  
  <div class="status-section">
    <div class="status-title">📝 Console</div>
    <div class="console-log" id="console-log"></div>
  </div>
  
</div>

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- SCRIPTS À CHARGER (ORDRE IMPORTANT!) -->
<!-- ════════════════════════════════════════════════════════════════════════ -->

<!-- 1️⃣ Configuration (charger en premier) -->
<script src="config.js"></script>

<!-- 2️⃣ Moteur de recherche avancé -->
<script src="advanced-search.js"></script>
<script src="advanced-algorithms.js"></script>

<!-- 3️⃣ Itinéraire intelligent -->
<script src="smart-itinerary-ai.js"></script>

<!-- 4️⃣ Fonction de logging personnalisée -->
<script>
  const logs = [];
  const maxLogs = 100;
  
  function addLog(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    const entry = `[${timestamp}] ${message}`;
    logs.push({ message: entry, type });
    
    if (logs.length > maxLogs) {
      logs.shift();
    }
    
    updateConsoleDisplay();
  }
  
  function updateConsoleDisplay() {
    const consoleDiv = document.getElementById('console-log');
    consoleDiv.innerHTML = logs.map(log => 
      `<div class="log-entry log-${log.type}">${log.message}</div>`
    ).join('');
    
    // Auto-scroll to bottom
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
  }
  
  // Override console.log
  const originalLog = console.log;
  console.log = function(...args) {
    originalLog.apply(console, args);
    addLog(args.join(' '), 'info');
  };
  
  const originalError = console.error;
  console.error = function(...args) {
    originalError.apply(console, args);
    addLog('❌ ' + args.join(' '), 'error');
  };
  
  const originalWarn = console.warn;
  console.warn = function(...args) {
    originalWarn.apply(console, args);
    addLog('⚠️ ' + args.join(' '), 'error');
  };
</script>

<!-- 5️⃣ Script de vérification des chargements -->
<script>
  window.addEventListener('load', () => {
    addLog('✅ Page chargée', 'success');
    
    // Vérifier les objets globaux
    setTimeout(() => {
      checkScripts();
    }, 500);
  });
  
  function checkScripts() {
    addLog('📋 Vérification des scripts...', 'info');
    
    // 1. Config
    if (typeof PWA_CONFIG !== 'undefined') {
      updateStatus('status-config', 'ok');
      addLog('✅ config.js chargé', 'success');
    } else {
      updateStatus('status-config', 'error');
      addLog('❌ config.js NOT FOUND', 'error');
    }
    
    // 2. Moteur recherche
    if (typeof AdvancedSearchEngine !== 'undefined') {
      updateStatus('status-search', 'ok');
      addLog('✅ advanced-search.js chargé', 'success');
    } else {
      updateStatus('status-search', 'error');
      addLog('❌ advanced-search.js NOT FOUND', 'error');
    }
    
    // 3. Algorithmes
    if (typeof advancedAlgorithms !== 'undefined' || typeof TFIDFRanker !== 'undefined') {
      updateStatus('status-algorithms', 'ok');
      addLog('✅ advanced-algorithms.js chargé', 'success');
    } else {
      updateStatus('status-algorithms', 'error');
      addLog('❌ advanced-algorithms.js NOT FOUND', 'error');
    }
    
    // 4. Itinéraire IA
    if (typeof SmartItineraryAI !== 'undefined') {
      updateStatus('status-itinerary', 'ok');
      addLog('✅ smart-itinerary-ai.js chargé', 'success');
    } else {
      updateStatus('status-itinerary', 'error');
      addLog('❌ smart-itinerary-ai.js NOT FOUND', 'error');
    }
    
    // 5. Service Worker
    if ('serviceWorker' in navigator) {
      updateStatus('status-sw', 'ok');
      addLog('✅ Service Worker disponible', 'success');
      
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length > 0) {
          addLog('✅ Service Worker ENREGISTRÉ', 'success');
        } else {
          addLog('⚠️ Service Worker pas encore enregistré', 'error');
        }
      });
    } else {
      updateStatus('status-sw', 'error');
      addLog('❌ Service Worker NOT SUPPORTED', 'error');
    }
  }
  
  function updateStatus(elementId, status) {
    const element = document.getElementById(elementId);
    if (!element) return;
    
    const statusSpan = element.querySelector('span');
    if (status === 'ok') {
      statusSpan.className = 'status-ok';
      statusSpan.textContent = '✅';
    } else if (status === 'error') {
      statusSpan.className = 'status-error';
      statusSpan.textContent = '❌';
    }
  }
  
  function testSearch() {
    if (typeof searchEngine === 'undefined') {
      addLog('❌ Moteur recherche pas disponible', 'error');
      return;
    }
    
    addLog('🔍 Test recherche...', 'info');
    
    // Données de test
    const testData = [
      { id: 1, name: 'Mosquée A', category: 'mosque', distance: 2.5 },
      { id: 2, name: 'Mosquée B', category: 'mosque', distance: 1.2 },
      { id: 3, name: 'Hôpital C', category: 'hospital', distance: 3.0 }
    ];
    
    searchEngine.indexData(testData);
    const results = searchEngine.search('مسجد');
    
    addLog(`✅ Recherche trouvé ${results.length} résultats`, 'success');
    results.forEach(r => {
      addLog(`   - ${r.name}`, 'info');
    });
  }
  
  function testItinerary() {
    if (typeof SmartItineraryAI === 'undefined') {
      addLog('❌ Itinéraire AI pas disponible', 'error');
      return;
    }
    
    addLog('🎤 Test itinéraire...', 'info');
    
    const ai = new SmartItineraryAI();
    const testData = [
      { id: 1, name: 'Mosquée A', distance: 2, accessibility: 5, rating: 4.8 },
      { id: 2, name: 'Mosquée B', distance: 5, accessibility: 10, rating: 4.2 }
    ];
    
    ai.userPreferences = { distance: 7, accessibility: 9 };
    const results = ai.findBestItinerary(testData);
    
    addLog(`✅ Itinéraire trouvé`, 'success');
    addLog(`   🥇 ${results[0].location.name} - ${results[0].score}%`, 'info');
  }
  
  function clearLogs() {
    logs.length = 0;
    updateConsoleDisplay();
    addLog('Console effacée', 'info');
  }
</script>

<!-- 5️⃣ Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('✅ SW enregistré:', registration);
        })
        .catch(error => {
          console.error('❌ Erreur SW:', error);
        });
    });
  }
</script>

</body>
</html>
