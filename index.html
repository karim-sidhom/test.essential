<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LORD SYSTEM - نظام التنقل الموحد الذكي في الوقت الفعلي">
<meta name="theme-color" content="#0a0500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LORD SYSTEM">

<title>LORD SYSTEM — نظام التنقل الذكي</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230a0500' width='192' height='192'/><text x='96' y='140' font-size='120' text-anchor='middle' fill='%23e87722' font-weight='bold'>👑</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230a0500' width='192' height='192'/><text x='96' y='140' font-size='120' text-anchor='middle' fill='%23e87722' font-weight='bold'>👑</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --deep:#0a0500;--dark:#150800;
  --gold:#7a3a00;--gold-bright:#e87722;--gold-shine:#f5a623;--gold-deep:#7a3a00;
  --gold-glow:rgba(232,119,34,0.55);--gold-dim:rgba(232,119,34,0.12);
  --text:#fff4e8;--text-dim:#c89060;
  --card:rgba(20,8,0,0.92);--card-border:rgba(232,119,34,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--deep);color:var(--text);min-height:100vh;padding:0 0 40px;overflow-x:hidden;}

.bg-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,5,0,0.92) 0%,rgba(30,12,0,0.7) 40%,rgba(10,5,0,0.95) 100%);z-index:0;}
.gold-topline{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold-deep),var(--gold-bright),var(--gold-shine),var(--gold-bright),var(--gold-deep),transparent);box-shadow:0 0 20px 6px var(--gold-glow);z-index:10;animation:shimmer 3s ease-in-out infinite;}
@keyframes shimmer{0%,100%{box-shadow:0 0 20px 6px var(--gold-glow);}50%{box-shadow:0 0 40px 12px rgba(232,119,34,0.9);}}

.app{position:relative;z-index:2;max-width:500px;margin:0 auto;padding:0 16px;}

/* HEADER */
.header{text-align:center;padding:50px 0 20px;}
.quran-banner{background:linear-gradient(135deg,rgba(20,8,0,0.97),rgba(50,20,0,0.94));border:1px solid rgba(232,119,34,0.35);border-radius:16px;padding:14px 18px;margin-bottom:20px;text-align:center;}
.bismillah{font-family:'Amiri',serif;font-size:20px;color:var(--gold-shine);text-shadow:0 0 15px rgba(232,119,34,0.7);display:block;margin-bottom:6px;}
.app-title{font-family:'Amiri',serif;font-size:40px;font-weight:700;background:linear-gradient(160deg,#4a2500,var(--gold-bright),var(--gold-shine),#ffe0eb,var(--gold-shine),var(--gold-bright),#4a2500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:gold-flow 4s ease-in-out infinite;letter-spacing:4px;}
@keyframes gold-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* SEARCH BAR - RENFORCÉE */
.search-container{margin-bottom:20px;}
.search-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  background:linear-gradient(135deg,rgba(232,119,34,0.08),rgba(232,119,34,0.03));
  padding:12px;
  border:2px solid rgba(232,119,34,0.35);
  border-radius:12px;
}
.search-input{
  flex:1;
  padding:12px;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(232,119,34,0.25);
  color:var(--text);
  border-radius:8px;
  font-family:'Tajawal',sans-serif;
  font-size:14px;
  outline:none;
  direction:rtl;
}
.search-input::placeholder{color:rgba(200,140,60,0.5);}
.search-input:focus{
  border-color:var(--gold-bright);
  box-shadow:0 0 12px rgba(232,119,34,0.3);
}
.search-btn{
  padding:12px 18px;
  background:linear-gradient(135deg,var(--gold-deep),var(--gold-bright));
  color:#0a0500;
  border:none;
  border-radius:8px;
  font-weight:800;
  font-family:'Tajawal';
  cursor:pointer;
  font-size:14px;
  transition:all 0.3s;
}
.search-btn:active{transform:scale(0.95);}

/* CATEGORY FILTERS */
.category-filter{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0;
  margin-bottom:16px;
}
.filter-btn{
  padding:10px 16px;
  background:rgba(232,119,34,0.08);
  border:1.5px solid rgba(232,119,34,0.3);
  color:var(--gold-bright);
  border-radius:20px;
  font-family:'Tajawal';
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  transition:all 0.3s;
  flex-shrink:0;
}
.filter-btn.active{
  background:var(--gold-bright);
  color:#0a0500;
  box-shadow:0 0 15px rgba(232,119,34,0.4);
}

/* CARDS */
.cards-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.service-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:16px;overflow:hidden;transition:transform .2s;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;background:linear-gradient(135deg,rgba(232,119,34,0.08),rgba(232,119,34,0.02));}
.card-left{display:flex;align-items:center;gap:14px;}
.card-icon{font-size:28px;filter:drop-shadow(0 0 6px rgba(232,119,34,0.5));}
.card-title{font-family:'Amiri',serif;font-size:17px;font-weight:700;color:var(--gold-shine);}
.card-nearest{font-size:11px;color:rgba(200,140,60,0.6);font-family:'DM Mono',monospace;margin-top:3px;direction:ltr;}
.card-actions{display:flex;align-items:center;gap:10px;}
.card-open-btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(232,119,34,0.12);border:1px solid rgba(232,119,34,0.4);color:var(--gold-bright);text-decoration:none;font-family:'Tajawal';cursor:pointer;white-space:nowrap;}

/* CARD BODY - RESULTS */
.card-body{display:none;border-top:1px solid rgba(232,119,34,0.12);padding:8px 14px;max-height:500px;overflow-y:auto;}
.card-body.open{display:block;}
.result-item{
  background:linear-gradient(135deg,rgba(180,90,10,0.18),rgba(232,119,34,0.08),rgba(20,150,60,0.12));
  border:1.5px solid var(--gold-bright);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:10px;
  direction:rtl;
  box-shadow:0 4px 15px rgba(0,0,0,0.5),0 0 12px rgba(232,119,34,0.15);
  transition:transform .2s;
}
.result-item:active{transform:scale(1.02);}
.result-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.result-rank{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold-deep),var(--gold-bright));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0a0500;flex-shrink:0;}
.result-name{font-size:20px;color:var(--gold-shine);font-weight:700;font-family:'Amiri',serif;line-height:1.4;}
.result-dist{font-size:12px;color:rgba(200,140,60,0.8);font-family:'DM Mono',monospace;margin-top:3px;direction:ltr;}
.result-btns{display:flex;gap:8px;}
.result-btn-nav{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:800;background:linear-gradient(135deg,rgba(232,119,34,0.22),rgba(232,119,34,0.08));border:1.5px solid var(--gold-bright);color:var(--gold-bright);text-decoration:none;font-family:'Tajawal';text-align:center;}

.no-results{text-align:center;padding:16px;font-size:13px;color:rgba(200,140,60,0.4);font-family:'Tajawal';}

/* FOOTER */
.footer{text-align:center;padding:16px 0;}
.footer-arabic{font-family:'Amiri',serif;font-size:22px;color:var(--gold-bright);display:block;margin-bottom:4px;}
.install-btn{
  display:none;
  width:100%;
  padding:16px;
  margin-top:20px;
  background:linear-gradient(135deg,var(--gold-deep),var(--gold-bright));
  color:#0a0500;
  border:none;
  border-radius:12px;
  font-family:'Tajawal';
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(232,119,34,0.3);
}
.install-btn.show{display:block;}
</style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="gold-topline"></div>

<div class="app">
  <div class="quran-banner" style="margin-top:50px;">
    <span class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
    <div style="font-family:'Amiri',serif;font-size:15px;color:var(--gold-bright);line-height:2;">وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ</div>
  </div>

  <div class="header" style="padding-top:0;">
    <div class="app-title">LORD SYSTEM</div>
  </div>

  <!-- SEARCH RENFORCÉE -->
  <div class="search-container">
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث هنا...">
      <button class="search-btn" onclick="performSearch()">🔍</button>
    </div>
    <div class="category-filter" id="categoryFilter">
      <button class="filter-btn active" data-category="all" onclick="filterCategory('all')">الكل</button>
      <button class="filter-btn" data-category="mosque" onclick="filterCategory('mosque')">🕌 مسجد</button>
      <button class="filter-btn" data-category="hospital" onclick="filterCategory('hospital')">🏥 مستشفى</button>
      <button class="filter-btn" data-category="police" onclick="filterCategory('police')">🚔 شرطة</button>
      <button class="filter-btn" data-category="pharmacy" onclick="filterCategory('pharmacy')">⚕️ صيدلية</button>
    </div>
  </div>

  <!-- 4 SERVICE CARDS -->
  <div class="cards-grid">

    <!-- 🕌 MOSQUÉE -->
    <div class="service-card" data-category="mosque">
      <div class="card-header" onclick="toggleCard('mosque')">
        <div class="card-left">
          <span class="card-icon">🕌</span>
          <div class="card-info">
            <div class="card-title">المسجد الأقرب</div>
            <div class="card-nearest" id="nearest-mosque">جارٍ البحث...</div>
          </div>
        </div>
        <span class="card-arrow" id="arrow-mosque">▼</span>
      </div>
      <div class="card-body" id="body-mosque"></div>
    </div>

    <!-- 🏥 HÔPITAL -->
    <div class="service-card" data-category="hospital">
      <div class="card-header" onclick="toggleCard('hospital')">
        <div class="card-left">
          <span class="card-icon">🏥</span>
          <div class="card-info">
            <div class="card-title">المستشفى الأقرب</div>
            <div class="card-nearest" id="nearest-hospital">جارٍ البحث...</div>
          </div>
        </div>
        <span class="card-arrow" id="arrow-hospital">▼</span>
      </div>
      <div class="card-body" id="body-hospital"></div>
    </div>

    <!-- 🚔 POLICE -->
    <div class="service-card" data-category="police">
      <div class="card-header" onclick="toggleCard('police')">
        <div class="card-left">
          <span class="card-icon">🚔</span>
          <div class="card-info">
            <div class="card-title">مركز الشرطة الأقرب</div>
            <div class="card-nearest" id="nearest-police">جارٍ البحث...</div>
          </div>
        </div>
        <span class="card-arrow" id="arrow-police">▼</span>
      </div>
      <div class="card-body" id="body-police"></div>
    </div>

    <!-- ⚕️ PHARMACIE -->
    <div class="service-card" data-category="pharmacy">
      <div class="card-header" onclick="toggleCard('pharmacy')">
        <div class="card-left">
          <span class="card-icon">⚕️</span>
          <div class="card-info">
            <div class="card-title">الصيدلية الأقرب</div>
            <div class="card-nearest" id="nearest-pharmacy">جارٍ البحث...</div>
          </div>
        </div>
        <span class="card-arrow" id="arrow-pharmacy">▼</span>
      </div>
      <div class="card-body" id="body-pharmacy"></div>
    </div>
  </div>

  <button class="install-btn" id="installBtn" onclick="installApp()">📱 تثبيت التطبيق</button>

  <div class="footer">
    <span class="footer-arabic">نظام التنقل الموحد الذكي</span>
  </div>
</div>

<script>
// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => {
    console.log('✅ Service Worker registered');
  }).catch(e => console.error('❌ SW Error:', e));
}

// MOCK DATA - Replace with real API calls
const mockData = {
  mosque: [
    { name: 'جامع الزيتونة', dist: '0.3 km', lat: 36.7954, lng: 10.1646 },
    { name: 'جامع عقبة بن نافع', dist: '0.8 km', lat: 36.7931, lng: 10.1689 },
    { name: 'جامع الحمراء', dist: '1.2 km', lat: 36.7891, lng: 10.1567 }
  ],
  hospital: [
    { name: 'مستشفى تونس المركزي', dist: '0.5 km', lat: 36.8059, lng: 10.1848 },
    { name: 'مستشفى الرابطة', dist: '1.1 km', lat: 36.7865, lng: 10.1743 },
    { name: 'مستشفى 9 أفريل', dist: '1.5 km', lat: 36.7743, lng: 10.1591 }
  ],
  police: [
    { name: 'مركز الشرطة المدينة', dist: '0.4 km', lat: 36.7981, lng: 10.1687 },
    { name: 'مركز شرطة الموظفين', dist: '0.9 km', lat: 36.7902, lng: 10.1623 },
    { name: 'مركز شرطة الحمراء', dist: '1.3 km', lat: 36.7843, lng: 10.1515 }
  ],
  pharmacy: [
    { name: 'صيدلية النجاح', dist: '0.2 km', lat: 36.7965, lng: 10.1701 },
    { name: 'صيدلية الأمل', dist: '0.7 km', lat: 36.7908, lng: 10.1629 },
    { name: 'صيدلية الشفاء', dist: '1.0 km', lat: 36.7851, lng: 10.1558 }
  ]
};

let currentCategory = 'all';

// Toggle Card
function toggleCard(category) {
  const body = document.getElementById(`body-${category}`);
  const arrow = document.getElementById(`arrow-${category}`);
  
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    arrow.style.transform = 'rotate(0deg)';
  } else {
    body.classList.add('open');
    arrow.style.transform = 'rotate(180deg)';
    displayResults(category);
  }
}

// Display Results
function displayResults(category) {
  const body = document.getElementById(`body-${category}`);
  const data = mockData[category] || [];
  
  if (data.length === 0) {
    body.innerHTML = '<div class="no-results">لا توجد نتائج</div>';
    return;
  }
  
  body.innerHTML = data.map((item, idx) => `
    <div class="result-item">
      <div class="result-top">
        <div class="result-rank">${idx + 1}</div>
        <div class="result-info">
          <div class="result-name">${item.name}</div>
          <div class="result-dist">📍 ${item.dist}</div>
        </div>
      </div>
      <div class="result-btns">
        <a href="https://maps.google.com/?q=${item.lat},${item.lng}" target="_blank" class="result-btn-nav">🗺️ خريطة</a>
        <a href="tel:+21671000000" class="result-btn-nav">☎️ اتصل</a>
      </div>
    </div>
  `).join('');
}

// Filter Category
function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  document.querySelectorAll('.service-card').forEach(card => {
    if (cat === 'all' || card.dataset.category === cat) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}

// Search Function
function performSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  
  if (!query) {
    alert('يرجى إدخال كلمة للبحث');
    return;
  }
  
  const results = {};
  for (const [category, items] of Object.entries(mockData)) {
    results[category] = items.filter(item => item.name.includes(query));
  }
  
  // Display all results
  for (const [category, items] of Object.entries(results)) {
    const body = document.getElementById(`body-${category}`);
    if (items.length > 0) {
      body.innerHTML = items.map((item, idx) => `
        <div class="result-item">
          <div class="result-top">
            <div class="result-rank">${idx + 1}</div>
            <div class="result-info">
              <div class="result-name">${item.name}</div>
              <div class="result-dist">📍 ${item.dist}</div>
            </div>
          </div>
          <div class="result-btns">
            <a href="https://maps.google.com/?q=${item.lat},${item.lng}" target="_blank" class="result-btn-nav">🗺️ خريطة</a>
          </div>
        </div>
      `).join('');
    }
  }
}

// Initialize nearest results
window.addEventListener('load', () => {
  document.querySelectorAll('.service-card').forEach(card => {
    const category = card.dataset.category;
    const nearest = mockData[category][0];
    document.getElementById(`nearest-${category}`).textContent = nearest.dist;
  });
});

// Install PWA Button
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('show');
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('✅ PWA installée');
      }
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
  }
}

// Enter key to search
document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') performSearch();
});
</script>
</body>
</html>
